[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-candidate-evaluation-system"
version = "1.0.0"
description = "Evidence-grounded multi-agent AI interview panel simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
openai = ["openai>=2.0,<3"]
all = ["pytest>=8,<10", "openai>=2.0,<3"]

[project.scripts]
candidate-eval = "candidate_eval.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["candidate_eval*"]
